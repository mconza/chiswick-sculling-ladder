<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSL Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .podium { display: flex; justify-content: center; align-items: flex-end; gap: 0.5rem; margin-bottom: 2rem; }
    .pod-slot { text-align: center; flex: 1; max-width: 200px; }
    .pod-name { font-weight: 700; font-size: 0.8rem; margin-top: 0.4rem; }
    .pod-club { font-size: 0.65rem; color: var(--text-light); }
    .pod-rank { font-size: 0.7rem; color: var(--accent); font-weight: 600; margin-top: 0.2rem; }
    .pod-base {
      height: var(--h);
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-top: 0.5rem;
    }
    .pod-1 .pod-base { background: linear-gradient(135deg, #FFD700, #FFA500); --h: 100px; }
    .pod-2 .pod-base { background: linear-gradient(135deg, #C0C0C0, #A8A8A8); --h: 75px; }
    .pod-3 .pod-base { background: linear-gradient(135deg, #CD7F32, #A0522D); --h: 60px; }

    .rank-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .rank-search {
      padding: 0.45rem 0.75rem;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.82rem;
      width: 220px;
      max-width: 100%;
    }
    .rank-search:focus { outline: none; border-color: var(--primary); }
    .rank-sort-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-family: var(--font);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-light);
    }
    .rank-sort-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid var(--border);
    }

    .rank-list {
      background: var(--bg-card);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .rank-row {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-row:hover { background: #f8fafc; }
    .rank-num { width: 45px; font-weight: 700; color: var(--primary); text-align: center; flex-shrink: 0; }
    .rank-name { flex: 1; font-weight: 600; }
    .rank-club { font-size: 0.7rem; color: var(--text-light); background: var(--bg); padding: 0.1rem 0.4rem; border-radius: 3px; margin-left: 0.5rem; white-space: nowrap; }

    .not-ranked .rank-num { color: var(--text-light); font-weight: 500; }
    .not-ranked .rank-name { font-weight: 500; }

    @media (max-width: 600px) {
      .pod-slot { max-width: 120px; }
      .pod-1 .pod-base { --h: 80px; font-size: 1.5rem; }
      .pod-2 .pod-base { --h: 60px; font-size: 1.3rem; }
      .pod-3 .pod-base { --h: 50px; font-size: 1.3rem; }
      .pod-name { font-size: 0.7rem; }
      .rank-row { font-size: 0.72rem; padding: 0.4rem 0.6rem; }
      .rank-search { width: 100%; }
    }
  </style>
</head>

var currentSort = 'rank';
var ranked = [];
var unranked = [];
var computedRanks = {};
var myCaught = {};

function getComputedRank(s) {
  if (computedRanks[s.id] !== undefined) return computedRanks[s.id];
  return s.rank ? parseInt(s.rank) : 0;
}

function computeRankings() {
  scullers.forEach(function(s) {
    computedRanks[s.id] = s.rank ? parseInt(s.rank) : 0;
  });
  var starters = scullers.filter(function(s) { return s.lastStartPos != null; });
  if (starters.length === 0) return;
  starters.sort(function(a, b) { return parseInt(a.lastStartPos) - parseInt(b.lastStartPos); });
  var minRank = Infinity;
  starters.forEach(function(s) {
    var r = s.rank ? parseInt(s.rank) : 0;
    if (r > 0 && r < minRank) minRank = r;
  });
  if (minRank === Infinity) return;
  var originalRank = {};
  starters.forEach(function(s) {
    originalRank[s.id] = s.rank ? parseInt(s.rank) : 0;
  });
  var result = {};
  starters.forEach(function(s) {
    result[s.id] = originalRank[s.id];
  });
  var i = 0;
  while (i < starters.length) {
    var caught = myCaught[starters[i].id] !== undefined ? myCaught[starters[i].id] : starters[i].lastCaught;
    if (caught !== 'No') { i++; continue; }
    var chainStart = i;
    while (i < starters.length) {
      caught = myCaught[starters[i].id] !== undefined ? myCaught[starters[i].id] : starters[i].lastCaught;
      if (caught !== 'No') break;
      i++;
    }
    var chainEnd = i - 1;
    var chainLen = chainEnd - chainStart + 1;
    var boundaryRank;
    if (i < starters.length) {
      boundaryRank = originalRank[starters[i].id];
    } else {
      boundaryRank = minRank - 1;
    }
    for (var j = 0; j < chainLen; j++) {
      result[starters[chainStart + j].id] = boundaryRank + j;
    }
    if (i < starters.length) {
      result[starters[i].id] = boundaryRank + chainLen;
    }
  }
  starters.forEach(function(s) {
    computedRanks[s.id] = result[s.id];
  });
}

function escHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function init() {
  computeRankings();
  ranked = scullers.filter(function(s) { return s.rank; });
  unranked = scullers.filter(function(s) { return !s.rank; }).sort(function(a, b) { return a.name.localeCompare(b.name); });

  document.getElementById('rankInfo').textContent =
    ranked.length + ' ranked scullers from ' + new Set(scullers.map(function(s) { return s.club; })).size + ' clubs';

  renderPodium();
  renderList();
  renderUnranked();
}

function renderPodium() {
  var sorted = ranked.slice().sort(function(a, b) { return getComputedRank(a) - getComputedRank(b); });
  if (sorted.length < 3) { document.getElementById('podium').innerHTML = ''; return; }
  var h = '<div class="podium">';
  h += '<div class="pod-slot pod-2"><div class="pod-name">' + escHtml(sorted[1].name) + '</div><div class="pod-club">' + escHtml(sorted[1].club) + '</div><div class="pod-rank">#' + getComputedRank(sorted[1]) + '</div><div class="pod-base">2</div></div>';
  h += '<div class="pod-slot pod-1"><div class="pod-name">' + escHtml(sorted[0].name) + '</div><div class="pod-club">' + escHtml(sorted[0].club) + '</div><div class="pod-rank">#' + getComputedRank(sorted[0]) + '</div><div class="pod-base">1</div></div>';
  h += '<div class="pod-slot pod-3"><div class="pod-name">' + escHtml(sorted[2].name) + '</div><div class="pod-club">' + escHtml(sorted[2].club) + '</div><div class="pod-rank">#' + getComputedRank(sorted[2]) + '</div><div class="pod-base">3</div></div>';
  h += '</div>';
  document.getElementById('podium').innerHTML = h;
}

function renderList() {
  var q = document.getElementById('rankSearch').value.toLowerCase().trim();
  var list = ranked.slice();
  if (currentSort === 'rank') list.sort(function(a, b) { return getComputedRank(a) - getComputedRank(b); });
  else if (currentSort === 'name') list.sort(function(a, b) { return a.name.localeCompare(b.name); });
  else list.sort(function(a, b) { return a.club.localeCompare(b.club) || getComputedRank(a) - getComputedRank(b); });

  if (q) list = list.filter(function(s) {
    return s.name.toLowerCase().indexOf(q) !== -1 || s.club.toLowerCase().indexOf(q) !== -1;
  });

  var h = list.map(function(s) {
    return '<div class="rank-row"><div class="rank-num">#' + getComputedRank(s) + '</div><div class="rank-name">' + escHtml(s.name) + '</div><div class="rank-club">' + escHtml(s.club) + '</div></div>';
  }).join('');
  document.getElementById('rankedList').innerHTML = h || '<div class="rank-row" style="justify-content:center;color:var(--text-light);">No results</div>';
}

function renderUnranked() {
  var q = document.getElementById('rankSearch').value.toLowerCase().trim();
  var list = unranked.slice();
  if (q) list = list.filter(function(s) {
    return s.name.toLowerCase().indexOf(q) !== -1 || s.club.toLowerCase().indexOf(q) !== -1;
  });
  if (list.length > 0) {
    document.getElementById('unrankedTitle').textContent = 'Not Ranked Yet \uD83D\uDE0E ' + list.length + ' brave newcomers';
    var h = list.map(function(s) {
      return '<div class="rank-row not-ranked"><div class="rank-num">n/a</div><div class="rank-name">' + escHtml(s.name) + '</div><div class="rank-club">' + escHtml(s.club) + '</div></div>';
    }).join('');
    document.getElementById('unrankedList').innerHTML = h;
    document.getElementById('unrankedTitle').style.display = '';
    document.getElementById('unrankedList').style.display = '';
  } else {
    document.getElementById('unrankedTitle').style.display = 'none';
    document.getElementById('unrankedList').style.display = 'none';
  }
}

function sortBy(field) {
  currentSort = field;
  document.querySelectorAll('.rank-sort-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('sort' + field.charAt(0).toUpperCase() + field.slice(1)).classList.add('active');
  renderList();
}

document.getElementById('rankSearch').addEventListener('input', function() {
  renderList();
  renderUnranked();
});

fetch('/api/votes')
  .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(function(data) {
    var lastSession = data.lastSession || {};
    myCaught = data.caught || {};
    scullers.forEach(function(s) {
      if (lastSession[s.id]) {
        s.lastStartPos = lastSession[s.id].lastStartPos;
        s.lastCaught = lastSession[s.id].lastCaught;
      }
    });
    init();
  })
  .catch(function() { init(); });
  </script>
