<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSL Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ranking.css">
</head>
<body>
  <header class="app-header">
    <a href="./index.html" class="logo">🚣 <span>Chiswick Sculling Ladder</span></a>
    <div class="right-group">
      <a href="./app.html" class="header-link">Ladder</a>
      <a href="./ranking.html" class="header-link active">Rankings</a>
      <span id="userBadge" class="user-badge">{{USER_NAME}}</span>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>
  </header>
  <script>
    (function() {
      var b = document.getElementById('userBadge');
      if (b.textContent.indexOf('{{') === 0) {
        var n = localStorage.getItem('csl_user_name');
        var c = localStorage.getItem('csl_user_club');
        var a = localStorage.getItem('csl_auth') === 'true';
        b.textContent = (n ? n + (c ? ' (' + c + ')' : '') : '');
        if (!a) b.style.display = 'none';
        document.getElementById('logoutBtn').style.display = a ? '' : 'none';
      }
    })();
  </script>

  <div class="container">
    <div class="page-title">
      <h1>Rankings</h1>
      <p id="rankInfo">Loading...</p>
    </div>

    <div id="podium"></div>

    <div class="rank-topbar">
      <input type="text" class="rank-search" id="rankSearch" placeholder="Search name or club...">
      <div>
        <button class="rank-sort-btn active" id="sortRank">By Rank</button>
        <button class="rank-sort-btn" id="sortName">By Name</button>
        <button class="rank-sort-btn" id="sortClub">By Club</button>
      </div>
    </div>

    <div class="section-title" id="listTitle">All Ranked Scullers</div>
    <div class="rank-list" id="rankedList"></div>

    <div class="section-title" id="unrankedTitle">Not Ranked Yet</div>
    <div class="rank-list" id="unrankedList"></div>
  </div>

  <script type="module" src="./js/ranking-page.js"></script>
</body>
</html>
