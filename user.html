<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiswick Sculling Ladder - My Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .user-login { max-width: 400px; margin: 3rem auto; text-align: center; }
    .user-login h2 { margin-bottom: 1rem; color: var(--text); }
    .user-login p { color: var(--text-light); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .code-input {
      width: 100%; padding: 0.85rem 1rem; font-size: 1.2rem;
      border: 2px solid var(--border); border-radius: var(--radius);
      text-align: center; font-family: var(--font); font-weight: 700;
      letter-spacing: 0.15em;
    }
    .code-input:focus { border-color: var(--accent); outline: none; }
    .enter-btn {
      width: 100%; margin-top: 1rem; padding: 0.85rem; font-size: 1rem;
      background: var(--primary); color: #fff; border: none;
      border-radius: var(--radius); font-family: var(--font);
      font-weight: 700; cursor: pointer;
    }
    .enter-btn:hover { background: var(--primary-dark); }

    .user-card {
      max-width: 500px; margin: 2rem auto;
      background: var(--bg-card); border-radius: var(--radius);
      padding: 1.5rem; box-shadow: var(--shadow);
    }
    .user-card .name { font-size: 1.3rem; font-weight: 800; }
    .user-card .club { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1rem; }
    .user-card .details { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem; }
    .user-card .detail-box { background: var(--bg-main); border-radius: 8px; padding: 0.75rem; }
    .user-card .detail-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-light); font-weight: 600; letter-spacing: 0.05em; }
    .user-card .detail-value { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-top: 0.2rem; }

    .user-actions { display: flex; gap: 0; margin-top: 1rem; }
    .user-actions .btn-table {
      flex: 1; padding: 0.75rem; font-size: 1rem; min-width: 0;
      border-radius: 0;
    }
    .user-actions .btn-table:first-child { border-radius: var(--radius) 0 0 var(--radius); border-right: 1px solid rgba(0,0,0,0.1); }
    .user-actions .btn-table:last-child { border-radius: 0 var(--radius) var(--radius) 0; }

    .user-position {
      text-align: center; margin-top: 1.25rem; padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .user-position .pos-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-light); font-weight: 600; }
    .user-position .pos-value { font-size: 2rem; font-weight: 800; color: var(--accent); }
    .user-position .pos-none { font-size: 0.9rem; color: var(--text-light); font-weight: 500; }

    .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    .user-header { display: flex; justify-content: space-between; align-items: center; }
    .user-header .back-btn {
      background: none; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0.4rem 0.8rem; font-family: var(--font); font-size: 0.8rem;
      color: var(--text-light); cursor: pointer;
    }
    .user-header .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="./app.html" class="logo">&#9875; <span>Chiswick Sculling Ladder</span></a>
    <div class="user-header">
      <button class="back-btn" id="logoutBtn" style="display:none;">&#8592; Switch User</button>
    </div>
  </header>

  <div class="container">

    <!-- Login screen -->
    <div class="user-login" id="loginScreen">
      <h2>My Session</h2>
      <p>Enter your personal code to confirm or decline the next ladder session.</p>
      <input type="text" class="code-input" id="codeInput" placeholder="Your code" inputmode="numeric" autocomplete="off" autofocus>
      <button class="enter-btn" id="enterBtn">Enter</button>
      <p class="error-msg" id="errorMsg">Code not found. Check with the organiser.</p>
    </div>

    <!-- User card (hidden initially) -->
    <div id="userScreen" style="display:none;">
      <div class="user-card">
        <div class="name" id="uName"></div>
        <div class="club" id="uClub"></div>
        <div class="details">
          <div class="detail-box">
            <div class="detail-label">Rank</div>
            <div class="detail-value" id="uRank"></div>
          </div>
          <div class="detail-box">
            <div class="detail-label">Last Session</div>
            <div class="detail-value" id="uLast"></div>
          </div>
          <div class="detail-box">
            <div class="detail-label">Caught?</div>
            <div class="detail-value" id="uCaught"></div>
          </div>
          <div class="detail-box">
            <div class="detail-label">Next Start</div>
            <div class="detail-value" id="uNextPos"></div>
          </div>
        </div>
        <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:0.5rem;">Are you participating in the next session?</p>
        <div class="user-actions" id="userActions">
          <button class="btn-table btn-yes-dim" data-val="Yes">&#10003; Yes</button>
          <button class="btn-table btn-no-dim" data-val="No">&#10007; No</button>
        </div>
        <div class="user-position" id="userPosition"></div>
      </div>
    </div>

  </div>

var myConfirmed = {};
var myId = null;
var currentSculler = null;

// Load from localStorage first, then fetch API
function loadVotes(cb) {
  myConfirmed = JSON.parse(localStorage.getItem('csl_confirmed') || '{}');
  fetch('/api/votes')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.confirmed) {
        for (var k in data.confirmed) { myConfirmed[k] = data.confirmed[k]; }
      }
      cb();
    })
    .catch(function() { cb(); });
}

function saveVote(id, val) {
  myConfirmed[id] = val;
  localStorage.setItem('csl_confirmed', JSON.stringify(myConfirmed));
  var payload = { confirmed: {} };
  payload.confirmed[id] = val;
  fetch('/api/votes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(function() {});
}

function computeNextPositions() {
  var confirmed = scullers.filter(function(s) {
    var p = myConfirmed[s.id] !== undefined ? myConfirmed[s.id] : s.nextParticipating;
    return p === 'Yes';
  }).sort(function(a, b) {
    var ra = a.rank ? parseInt(a.rank) : 9999;
    var rb = b.rank ? parseInt(b.rank) : 9999;
    return rb - ra;
  });
  var map = {};
  confirmed.forEach(function(s, i) { map[s.id] = i + 1; });
  return map;
}

function showUser() {
  var caughtVal = myConfirmed[currentSculler.id] !== undefined
    ? myConfirmed[currentSculler.id]
    : currentSculler.nextParticipating;

  document.getElementById('uName').textContent = currentSculler.name;
  document.getElementById('uClub').textContent = currentSculler.club;
  document.getElementById('uRank').textContent = currentSculler.rank || 'n/a';
  document.getElementById('uLast').textContent = currentSculler.lastStartPos || '-';
  document.getElementById('uCaught').textContent = currentSculler.lastCaught || '-';
  var pos = computeNextPositions();
  document.getElementById('uNextPos').textContent = pos[currentSculler.id] || '-';
  document.getElementById('logoutBtn').style.display = '';

  var btns = document.querySelectorAll('#userActions .btn-table');
  btns.forEach(function(b) {
    var v = b.dataset.val;
    b.className = 'btn-table ' + (caughtVal === v ? (v === 'Yes' ? 'btn-yes' : 'btn-no') : (v === 'Yes' ? 'btn-yes-dim' : 'btn-no-dim'));
  });

  var posDiv = document.getElementById('userPosition');
  if (pos[currentSculler.id]) {
    posDiv.innerHTML = '<div class="pos-label">Your Start Position</div><div class="pos-value">#' + pos[currentSculler.id] + '</div>';
  } else {
    posDiv.innerHTML = '<div class="pos-label">Next Session</div><div class="pos-none">Not participating</div>';
  }
}

// Login
document.getElementById('enterBtn').addEventListener('click', doLogin);
document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  var code = document.getElementById('codeInput').value.trim();
  if (!code) return;
  var found = scullers.find(function(s) { return s.id === parseInt(code); });
  if (!found) {
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }
  document.getElementById('errorMsg').style.display = 'none';
  currentSculler = found;
  myId = found.id;
  loadVotes(function() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('userScreen').style.display = '';
    showUser();
  });
}

// Vote buttons
document.querySelectorAll('#userActions .btn-table').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var val = this.dataset.val;
    var current = myConfirmed[myId];
    var newVal = (current === val) ? undefined : val;
    if (newVal === undefined) {
      delete myConfirmed[myId];
      saveVote(myId, null);
    } else {
      myConfirmed[myId] = newVal;
      saveVote(myId, newVal);
    }
    showUser();
  });
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', function() {
  localStorage.removeItem('csl_user');
  currentSculler = null;
  myId = null;
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('userScreen').style.display = 'none';
  document.getElementById('codeInput').value = '';
  document.getElementById('codeInput').focus();
});
  </script>
